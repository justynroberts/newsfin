name: newsfin
description: Impact-ranked world news. Headlines first.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    # House style: Bricolage Grotesque is the display and primary face. It is
    # variable across optical size, width and weight, so the whole hierarchy -
    # masthead, lead headline, standfirst, labels - comes from one family
    # rather than a second typeface.
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
    # Mono slot (a per-project choice): numerics, timestamps, source counts.
    - family: SplineSansMono
      fonts:
        - asset: assets/fonts/SplineSansMono.ttf

# App icon generation: `dart run flutter_launcher_icons`.
# Sources are built by tools/make_icons.py from assets/icon/source.png.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  # Adaptive icons are cropped to an inner safe zone and parallaxed by the
  # launcher, so the foreground is a separate, smaller composition.
  adaptive_icon_background: "#FBFAF7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

  ios: true
  # iOS rejects any alpha channel in an app icon.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FBFAF7"
    theme_color: "#0A0A0C"
