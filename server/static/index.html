  <!-- Installs to the home screen as a standalone app, which is the point:
       this should open like a native app, not like a browser tab. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NewsFin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Matches the app canvas in each theme so there is no flash of white
       behind the status bar while the engine boots. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFAF7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0C">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NewsFin — impact-ranked news</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* MIT License - Copyright (c) fintonlabs.com */

    /* The boot screen. Flutter takes a moment to paint on a cold load, and an
       unstyled white page in that window undoes the whole design. This paints
       the correct ground colour immediately in both themes. */
    :root {
      --bg: #FBFAF7;
      --text: #14141A;
      --muted: #5C5C66;
      --accent: #00915A;
      --line: #B4B1A6;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --bg: #0A0A0C;
        --text: #F4F3F0;
        --muted: #9C9CA6;
        --accent: #00C46A;
        --line: #565662;
      }
    }

    :root[data-theme='dark'] {
      --bg: #0A0A0C;
      --text: #F4F3F0;
      --muted: #9C9CA6;
      --accent: #00C46A;
      --line: #565662;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      font-family: 'Bricolage Grotesque', 'SF Pro Display', -apple-system, system-ui, sans-serif;
      /* No entrance animation on the boot screen itself. It used `both` fill,
         which holds opacity 0 until the animation starts - so if the main
         thread was busy the loading UI was invisible during exactly the wait
         it exists to explain. It paints immediately now; only the wordmark
         animates. */
    }

    #boot .wordmark, #boot .tagline, #boot .track, #boot .status {
      animation: rise-in 320ms cubic-bezier(0.2, 0, 0, 1) both;
    }

    #boot .wordmark {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.4px;
    }

    #boot .wordmark span { color: var(--accent); }

    #boot .tagline {
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* A real progress bar, driven by bytes actually downloaded - a cold load
       pulls ~3.4MB of engine and fonts, which is long enough that an
       indeterminate spinner would just look broken. */
    #boot .track {
      width: 220px;
      height: 4px;
      margin-top: 8px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }

    #boot .bar {
      height: 100%;
      /* Starts visible rather than at zero width. An empty track on a
         near-black canvas reads as "nothing is happening"; a green nub reads
         as "it has started", which is the honest state once the document has
         parsed and the engine request is in flight. */
      width: 6%;
      background: var(--accent);
      border-radius: 3px;
      /* Eased so byte-count jitter reads as steady movement. */
      transition: width 220ms cubic-bezier(0.2, 0, 0, 1);
    }

    #boot .status {
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-height: 12px;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    /* Boot screen fades out once Flutter has painted. */
    #boot.done {
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms cubic-bezier(0.2, 0, 0, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="wordmark">NEWS<span>FIN</span></div>
    <div class="tagline">Ranked by impact</div>
    <div class="track" role="progressbar" aria-label="Loading NewsFin"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="boot-track">
      <div class="bar" id="boot-bar"></div>
    </div>
    <div class="status" id="boot-status">Starting</div>
  </div>

  <script>
    // Real download progress.
    //
    // A cold load pulls the engine WASM, the compiled app and two fonts -
    // ~3.4MB gzipped. Flutter's loader exposes no progress, so `fetch` is
    // wrapped before the loader runs and the response bodies are counted as
    // they stream in. Nothing here is simulated: the bar only moves when
    // bytes actually arrive.
    (function () {
      var bar = document.getElementById('boot-bar');
      var track = document.getElementById('boot-track');
      var status = document.getElementById('boot-status');
      if (!bar) return;

      // Measured from the deployed bundle. Only used as the denominator until
      // the real Content-Lengths are known, and never allowed to shrink below
      // what has already arrived, so the bar cannot run backwards.
      var EXPECTED = 3400000;

      var loaded = 0;
      var expected = EXPECTED;
      var announced = 6;   // matches the CSS starting width
      var done = false;
      var shownAt = Date.now();

      // Below this the bar would appear and vanish in the same blink, which
      // reads as a glitch. Warm loads are fast enough to hit it every time.
      var MIN_VISIBLE_MS = 450;

      function paint() {
        if (done) return;
        var pct = Math.max(6, Math.min(97,
          Math.round((loaded / Math.max(expected, loaded, 1)) * 100)));
        // Monotonic: a late Content-Length must never pull the bar backwards.
        if (pct <= announced) return;
        announced = pct;
        bar.style.width = pct + '%';
        if (track) track.setAttribute('aria-valuenow', String(pct));
        if (status) {
          status.textContent = loaded > 250000
            ? 'Loading ' + (loaded / 1048576).toFixed(1) + ' MB'
            : 'Loading';
        }
      }

      function finish() {
        if (done) return;
        done = true;
        bar.style.width = '100%';
        if (track) track.setAttribute('aria-valuenow', '100');
        if (status) status.textContent = 'Ready';
      }

      // How long the boot screen still owes the viewer, so it is never a flash.
      window.__bootFinish = finish;
      window.__bootRemaining = function () {
        return Math.max(0, MIN_VISIBLE_MS - (Date.now() - shownAt));
      };

      // Only the heavyweight assets are worth counting; a 200-byte manifest
      // adds noise to the denominator and nothing to the wait.
      function tracked(url) {
        return /\.(wasm|js|ttf|otf|bin)(\?|$)/.test(url) && !/flutter_service_worker/.test(url);
      }

      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        var promise = nativeFetch(input, init);
        if (!tracked(url) || done) return promise;

        return promise.then(function (response) {
          var len = parseInt(response.headers.get('content-length') || '0', 10);
          if (len > 0) expected = Math.max(expected, loaded + len);

          // A cached response has no readable progress worth showing, and
          // tee-ing it wastes memory - count it whole and move on.
          if (!response.body || response.status === 304) {
            loaded += len;
            paint();
            return response;
          }

          var reader = response.body.getReader();
          var stream = new ReadableStream({
            start: function (controller) {
              (function pump() {
                reader.read().then(function (r) {
                  if (r.done) { controller.close(); return; }
                  loaded += r.value.byteLength;
                  paint();
                  controller.enqueue(r.value);
                  pump();
                }).catch(function (e) { controller.error(e); });
              })();
            }
          });
          return new Response(stream, {
            headers: response.headers,
            status: response.status,
            statusText: response.statusText
          });
        });
      };

      // The engine is fetched with XHR in some paths; count those too.
      var open = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        if (tracked(String(url))) {
          this.addEventListener('progress', function (e) {
            if (e.lengthComputable) {
              expected = Math.max(expected, loaded + e.total);
              loaded += 0; // progress events are cumulative per request
              paint();
            }
          });
        }
        return open.apply(this, arguments);
      };
    })();

    // Flutter owns the theme once it boots; this only stops the boot screen
    // flashing the wrong ground colour on a cold load.
    (function () {
      try {
        var stored = localStorage.getItem('newsfin.theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* private mode - fall back to prefers-color-scheme */ }
    })();

    window.addEventListener('flutter-first-frame', function () {
      if (window.__bootFinish) window.__bootFinish();
      var boot = document.getElementById('boot');
      if (!boot) return;
      // Hold until the bar has both reached 100% and been on screen long
      // enough to read. On a warm load everything is cached and the whole boot
      // lasts a few hundred milliseconds - without this the bar flickers past
      // and looks broken rather than fast.
      var wait = 160 + (window.__bootRemaining ? window.__bootRemaining() : 0);
      setTimeout(function () {
        boot.classList.add('done');
        setTimeout(function () { boot.remove(); }, 320);
      }, wait);
    });
  </script>
  <!-- Explicit loader rather than the default flutter_bootstrap.js, purely so
       canvasKitBaseUrl can be set. Flutter otherwise fetches the CanvasKit
       WASM from gstatic.com at runtime, which makes a morning news app fail to
       render on any network that blocks Google's CDN. The files are already in
       the image; the build-time --dart-define for this is not honoured. -->
  <!-- The build config is what flutter_bootstrap.js would normally inject.
       Omitting it leaves _flutter.buildConfig undefined and the loader never
       starts the engine - the page sits on the boot screen forever. -->
  <script>if (!window._flutter) {
  window._flutter = {};
}
_flutter.buildConfig = {"engineRevision":"39d6d6e699e51b2874210e14cddf1a22fb9524b2","builds":[{"compileTarget":"dart2js","renderer":"canvaskit","mainJsPath":"main.dart.js"}]};
</script>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function () {
      _flutter.loader.load({
        config: { canvasKitBaseUrl: '/canvaskit/' },
        serviceWorkerSettings: {
          serviceWorkerVersion: "390586137"
        }
      });
    });
  </script>

  <script>
    // Ship updates to an installed PWA.
    //
    // Flutter's service worker installs a new build and then *waits* until
    // every instance of the app is closed before taking over. A phone's home
    // screen app is essentially never fully closed, so a returning reader sits
    // on an old build while the server happily serves the current one - which
    // is exactly what happened here: the bundle was deployed and correct, and
    // the app on the phone did not have it.
    //
    // So: promote a waiting worker immediately, and reload once it takes over.
    (function () {
      if (!('serviceWorker' in navigator)) return;

      var reloading = false;
      // Only true once we have asked a *replacement* worker to take over. The
      // first install also fires controllerchange, on a page already showing
      // the current build - reloading there would be a pointless flash.
      var replacing = false;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!replacing || reloading) return;
        reloading = true;
        window.location.reload();
      });

      navigator.serviceWorker.ready.then(function (registration) {
        function promote(worker) {
          if (!worker) return;
          replacing = true;
          worker.postMessage('skipWaiting');
        }

        // A build that landed while the app was closed is already waiting.
        promote(registration.waiting);

        registration.addEventListener('updatefound', function () {
          var installing = registration.installing;
          if (!installing) return;
          installing.addEventListener('statechange', function () {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              promote(installing);
            }
          });
        });

        // Check for a new build whenever the app returns to the front, which
        // for a news app read every morning is the moment that matters.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            registration.update().catch(function () {});
          }
        });
      }).catch(function () {
        // No service worker (private mode, unsupported browser). The app still
        // works, it just fetches from the network each time.
      });
    })();

    // Belt and braces: an explicit build stamp.
    //
    // The service worker dance above depends on Flutter's worker behaving, and
    // it does not reliably: it serves index.html from its own cache, so the
    // page never even sees the new ?v= that would trigger an update, and it
    // never calls clients.claim(), so a promoted worker does not take over an
    // open page. An installed PWA can therefore sit on an old build through
    // any number of reloads - which is exactly what happened.
    //
    // build-id.json is written after the Flutter build, so it is absent from
    // the worker's resource manifest and always comes from the network. If it
    // has changed, clear the caches and reload: deterministic, and it does not
    // rely on any of the above working.
    (function () {
      var KEY = 'newsfin.build';

      function check() {
        fetch('build-id.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data || !data.id) return;
            var known = null;
            try { known = localStorage.getItem(KEY); } catch (e) { return; }

            if (known && known !== data.id) {
              // Record the new id *before* reloading, so a failure to clear
              // caches cannot turn this into a reload loop.
              try { localStorage.setItem(KEY, data.id); } catch (e) {}
              purge().then(function () { window.location.reload(); });
              return;
            }
            try { localStorage.setItem(KEY, data.id); } catch (e) {}
          })
          .catch(function () { /* offline: keep whatever is installed */ });
      }

      function purge() {
        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        return Promise.all(jobs).catch(function () {});
      }

      check();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check();
      });
    })();
  </script>
</body>
